<text x="352" y="604" class="body teal">Next-token logits +</text>
<text x="352" y="633" class="body teal">hidden states</text>
<text x="352" y="661" class="muted" font-size="14">No generated answer text</text>
<rect x="613" y="367" width="334" height="120" rx="15" fill="white" stroke="#cbdad9" />

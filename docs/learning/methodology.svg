<text x="66" y="973" font-size="25" font-weight="700">Seeded agent  →  Shared board  →  Recipient journal  →  Same battery</text>
<text x="66" y="1005" class="gold" font-size="16">Validate measurement first; then matched seeded/unseeded recipients, pre-seeding baseline and persistence checks.</text>
<text x="44" y="1060" class="muted" font-size="17">Supported: context-sensitive readouts. Moral adoption, persistence and contagion have not been established.</text>

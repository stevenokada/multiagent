<text x="613" y="711" class="muted" font-size="15">Frozen weights + scalers; semantic Supports direction is unchanged by an A/B swap.</text>
<rect x="44" y="736" width="1292" height="142" rx="15" fill="#edf2ef" stroke="#cbdad9" />
<text x="66" y="763" class="eyebrow teal">EXTRACTION + NUMERICAL GATE</text>
<text x="524" y="763" class="muted" font-size="16">Pinned revisions · BF16 · sequential A6000 (48 GB) runs</text>
<text x="66" y="800" font-size="18" font-weight="700">Gemma 2 9B IT</text>
<text x="327" y="800" class="body">HF 28 = block 27</text>
<text x="608" y="800" class="body">3,584 dimensions</text>
<text x="904" y="800" class="teal" font-size="17" font-weight="700">Batch-two gate: pass → batch 2</text>
<text x="66" y="832" font-size="18" font-weight="700">Llama 3.1 8B Instruct</text>
<text x="327" y="832" class="body">HF 20 = block 19</text>
<text x="608" y="832" class="body">4,096 dimensions</text>
<text x="904" y="832" class="gold" font-size="17" font-weight="700">Batch-two gate: fail → batch 1</text>
<text x="66" y="862" class="muted" font-size="15">48 numerical-check requests/model. The parallel two-GPU launcher was not used for the completed calibrations.</text>
<rect x="44" y="904" width="1292" height="121" rx="15" fill="#fff5dd" stroke="#c4a164" stroke-dasharray="6 5"/>

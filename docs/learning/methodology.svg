<text x="635" y="430" font-size="23" font-weight="700">A/B softmax</text>
<text x="635" y="462" class="muted" font-size="16">P(Supports | A or B) + classification</text>
<rect x="613" y="506" width="334" height="176" rx="15" fill="white" stroke="#cbdad9" />

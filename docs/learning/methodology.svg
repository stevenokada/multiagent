<text x="635" y="567" font-size="18" font-weight="700">Final real prompt token → h</text>
<text x="635" y="595" class="muted" font-size="16">Save float16 → score offline float32</text>
<text x="635" y="631" class="formula teal">raw = h · d − midpoint</text>
<text x="635" y="660" class="formula teal">z = (raw − μ) / σ</text>
<rect x="1015" y="385" width="321" height="297" rx="15" fill="white" stroke="#cbdad9" />
<text x="1035" y="413" class="eyebrow teal">05 · JOIN + COMPARE</text>
<text x="1035" y="453" font-size="23" font-weight="700">Matched comparisons</text>
<text x="1035" y="485" class="muted" font-size="16">call_id + trial / item / mapping</text>
<path d="M 1035 504 H 1316" fill="none" stroke="#dce6e3" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1035" y="534" class="body">Average both mappings</text>
<text x="1035" y="563" class="body">Collapse identical repeats</text>
<text x="1035" y="602" class="body teal">Targets · controls · quotation</text>
<text x="1035" y="631" class="body teal">Retain A/B gaps</text>
<text x="1035" y="660" class="body teal">Compare DIM + logistic</text>
<path d="M 291 490 H 328" fill="none" stroke="#087e80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 558 490 H 584 V 428 H 609" fill="none" stroke="#087e80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
